name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Build WASM
      - name: Build WASM from Source
        run: |
          git clone https://github.com/mmmray/xray-core.git build-source
          cd build-source
          go mod tidy
          GOOS=js GOARCH=wasm go build -o ../public/main.wasm -trimpath -ldflags "-s -w" ./main
          cd ..
          rm -rf build-source
          ls -lh public/main.wasm

      # 2. Build React App
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 3. Deploy
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
