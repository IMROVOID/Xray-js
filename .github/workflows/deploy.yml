name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Build WASM
      - name: Build WASM from Source (Patched)
        run: |
          # 1. Read version
          XRAY_VERSION=$(cat xray-version.txt)
          echo "Building Xray version: $XRAY_VERSION"
          
          # 2. Clone Upstream
          mkdir -p assets
          git clone https://github.com/xtls/xray-core.git assets/xray-core
          cd assets/xray-core
          git checkout $XRAY_VERSION
          
          # 3. Apply Patch
          # The patch file is in the root of the repo (../../xray-wasm.patch relative to assets/xray-core)
          git apply ../../xray-wasm.patch
          
          # 4. Move to patched location
          cd ../..
          rm -rf assets/xray-patched
          mv assets/xray-core assets/xray-patched
          
          # 5. Build
          go mod tidy
          GOOS=js GOARCH=wasm go build -o public/main.wasm -trimpath -ldflags "-s -w" main.go
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" public/
          ls -lh public/main.wasm public/wasm_exec.js

      # 2. Build React App
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 3. Deploy
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
